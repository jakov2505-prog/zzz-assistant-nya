name: Build ZZZ APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libltdl-dev libffi-dev libssl-dev python3-pip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev patch unzip libncurses5:i386 libstdc++6:i386 libz1:i386
          pip install --upgrade pip
          pip install buildozer kivy requests
          
      - name: Build APK with Buildozer
        env:
          ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
        run: |
          MAKEFLAGS="-j1" buildozer -v android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zzz-assistant-apk
          path: bin/*.apk

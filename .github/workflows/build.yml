name: Build ZZZ APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libstdc++6 gettext libffi-dev libssl-dev
          
      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer kivy requests

      - name: Run Buildozer Build
        env:
          ALLOW_ROOT: "1"
        run: |
          # Экспортируем и перезаписываем переменные окружения "на лету" перед запуском buildozer
          export ANDROID_NDK="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          export ANDROID_NDK_ROOT="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          
          # Запускаем сборку с принудительной передачей путей
          MAKEFLAGS="-j1" buildozer -v android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zzz-assistant-apk
          path: bin/*.apk
